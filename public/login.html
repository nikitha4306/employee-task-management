<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Task Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border: 1px solid var(--border-color);
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo {
            width: 48px;
            height: 48px;
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .login-header h2 {
            font-size: 1.3rem;
            color: var(--text-primary);
        }
        .login-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .btn-block {
            width: 100%;
            padding: 11px;
            font-size: 0.95rem;
            justify-content: center;
            margin-top: 10px;
        }
        .demo-credentials {
            margin-top: 20px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">ET</div>
            <h2>Employee Task Portal</h2>
            <p>Sign in to manage tasks & employees</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="admin@company.com" required value="admin@company.com">
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required value="admin123">
            </div>

            <div id="loginErrorMessage" style="color: #dc2626; font-size: 0.85rem; margin-bottom: 12px; display: none;"></div>

            <button type="submit" class="btn-primary btn-block">Sign In</button>
        </form>

        <div class="demo-credentials">
            <strong>Default Demo Credentials:</strong><br>
            Email: <code>admin@company.com</code><br>
            Password: <code>admin123</code>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginErrorMessage');

            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = '/index.html';
                } else {
                    errorEl.innerText = data.message || 'Invalid credentials';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorEl.innerText = 'Server error during login. Please try again.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
