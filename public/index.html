<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Employee Task Management System</h1>
    </header>

    <div class="container">

        <div class="stats-row">
            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="statTotal">0</p>
            </div>
            <div class="stat-card pending">
                <h3>Pending</h3>
                <p id="statPending">0</p>
            </div>
            <div class="stat-card progress">
                <h3>In Progress</h3>
                <p id="statInProgress">0</p>
            </div>
            <div class="stat-card completed">
                <h3>Completed</h3>
                <p id="statCompleted">0</p>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search task by title..." onkeyup="loadTasks()">
            
            <select id="statusFilter" onchange="loadTasks()">
                <option value="All">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <select id="priorityFilter" onchange="loadTasks()">
                <option value="All">All Priorities</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <button class="btn btn-add" onclick="openAddModal()">+ Add New Task</button>
        </div>

        <table class="task-table">
            <thead>
                <tr>
                    <th>Title & Description</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="taskTableBody">
            </tbody>
        </table>

    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Task</h2>
            
            <input type="hidden" id="taskId">

            <div class="form-group">
                <label>Task Title <span style="color:red">*</span></label>
                <input type="text" id="taskTitle" placeholder="Enter task title" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="taskDescription" placeholder="Enter task details"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Priority <span style="color:red">*</span></label>
                    <select id="taskPriority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status <span style="color:red">*</span></label>
                    <select id="taskStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Due Date <span style="color:red">*</span></label>
                <input type="date" id="taskDueDate" required>
            </div>

            <div id="formError" style="color: red; margin-bottom: 10px; display: none;"></div>

            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveTask()">Save Task</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
